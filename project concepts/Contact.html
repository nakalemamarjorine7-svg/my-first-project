<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body style="background-color:green;color:white;font-family: sans-serif;">

    <header>
        <h1>Contact Me</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="gallery.html">Project Gallery</a></li>
            <li><a href="data.html">Skills & Results</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Send a Message</h2>
            <p>If you have any questions regarding my BIT12026 projects, please use the form below.</p>
            
            <!-- Requirement: Form with Name, Email, Phone number, and Message -->
            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Information</legend>
                    
                    <p>
                        <label for="full-name">Name:</label>
                        <input type="text" id="full-name" name="full-name" required placeholder=" ">
                    </p>

                    <p>
                        <label for="user-email">Email:</label>
                        <!-- Requirement: HTML5 type="email" -->
                        <input type="email" id="user-email" name="user-email" required placeholder="name@example.com">
                    </p>

                    <p>
                        <label for="user-phone">Phone:</label>
                        <!-- Requirement: HTML5 type="tel" -->
                        <input type="tel" id="user-phone" name="user-phone" placeholder=" ">
                    </p>

                    <p>
                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" rows="5" cols="30" required></textarea>
                    </p>

                    <button type="submit">Send Message</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Name. BIT12026 Etivity 3.</p>
    </footer>

</body>
</html>
